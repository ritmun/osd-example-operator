apiVersion: hive.openshift.io/v1
kind: SelectorSyncSet
metadata:
  labels:
    managed.openshift.io/gitHash: staging-f6cf21a
    managed.openshift.io/gitRepoName: osd-example-operator
    managed.openshift.io/osd: 'true'
  name: osd-example-operator
spec:
  clusterDeploymentSelector:
    matchLabels:
      api.openshift.com/managed: 'true'
  resourceApplyMode: Sync
  resources:
  - apiVersion: v1
    kind: Namespace
    metadata:
      labels:
        openshift.io/cluster-monitoring: 'true'
      name: openshift-osd-example-operator
  - apiVersion: operators.coreos.com/v1
    kind: OperatorGroup
    metadata:
      name: osd-example-operator
      namespace: openshift-osd-example-operator
      annotations:
        olm.operatorframework.io/exclude-global-namespace-resolution: 'true'
    spec:
      targetNamespaces:
      - openshift-machine-api
  - apiVersion: operators.coreos.com/v1alpha1
    kind: CatalogSource
    metadata:
      labels:
        opsrc-datastore: 'true'
        opsrc-provider: redhat
      name: osd-example-operator-registry
      namespace: openshift-osd-example-operator
    spec:
      displayName: osd-example-operator
      icon:
        base64data: ''
        mediatype: ''
      image: quay.io/app-sre/osd-example-operator-registry@latest
      publisher: Red Hat
      sourceType: grpc
      grpcPodConfig:
        securityContextConfig: restricted
        nodeSelector:
          node-role.kubernetes.io: infra
        tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
  - apiVersion: operators.coreos.com/v1alpha1
    kind: Subscription
    metadata:
      name: osd-example-operator
      namespace: openshift-osd-example-operator
    spec:
      channel: staging
      name: osd-example-operator
      source: osd-example-operator-registry
      sourceNamespace: openshift-osd-example-operator